<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport
               [mode]="'side'" [opened]="true"
               aria-label="Navegación">
    <mat-toolbar color="primary" class="logo-bar">
      <img src="assets/logo-rym.svg" width="120" alt="Rym May">
    </mat-toolbar>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
        <mat-icon>insights</mat-icon> Panel
      </a>
      <a mat-list-item routerLink="/students" routerLinkActive="active">
        <mat-icon>group</mat-icon> Estudiantes
      </a>
      <a mat-list-item routerLink="/courses" routerLinkActive="active">
        <mat-icon>school</mat-icon> Cursos
      </a>
      <a mat-list-item routerLink="/payments" routerLinkActive="active">
        <mat-icon>credit_card</mat-icon> Pagos
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="topbar">
      <button type="button" aria-label="Mostrar/ocultar menú" mat-icon-button (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="flex-spacer"></span>
      <span>{{ title }}</span>
    </mat-toolbar>

    <!-- routed views -->
    <main class="page-container">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
