<h2 class="titulo-seccion">Registrar alumna</h2>

<form [formGroup]="form" class="student-form" (ngSubmit)="save()">
  <mat-form-field appearance="outline">
    <mat-label>Nombre completo</mat-label>
    <input matInput formControlName="fullName" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Teléfono</mat-label>
    <input matInput formControlName="phone" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Correo electrónico</mat-label>
    <input matInput formControlName="email" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Course ID</mat-label>
    <input matInput formControlName="courseId" placeholder="e.g. LASH‑BASICS" />
  </mat-form-field>

  <mat-checkbox formControlName="paidDeposit">Deposit paid</mat-checkbox>

  <button mat-raised-button color="accent" type="submit"
          [disabled]="form.invalid">Save</button>
</form>

<!-- list -->
<h3>Current students</h3>

<table mat-table [dataSource]="(students$ | async) || []" class="mat-elevation-z1">

  <ng-container matColumnDef="fullName">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let s">{{ s.fullName }}</td>
  </ng-container>

  <ng-container matColumnDef="phone">
    <th mat-header-cell *matHeaderCellDef>Phone</th>
    <td mat-cell *matCellDef="let s">{{ s.phone }}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let s">{{ s.email }}</td>
  </ng-container>

  <ng-container matColumnDef="courseId">
    <th mat-header-cell *matHeaderCellDef>Course</th>
    <td mat-cell *matCellDef="let s">{{ s.courseId }}</td>
  </ng-container>

  <ng-container matColumnDef="paidDeposit">
    <th mat-header-cell *matHeaderCellDef>Deposit</th>
    <td mat-cell *matCellDef="let s">
      <mat-icon color="primary">{{ s.paidDeposit ? 'check_circle' : 'hourglass_empty' }}</mat-icon>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row        *matRowDef="let row; columns: displayedColumns"></tr>
</table>
